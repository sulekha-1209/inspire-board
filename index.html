<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspire Board</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="bg" class="bg"></div>
    <div class="bg-overlay"></div>

    <header class="header">
        <div class="header-left">
            <span class="app-name">inspire</span>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="todo-toggle" onclick="toggleTodo()" title="To-do list">
                <i class="fa fa-list-ul"></i>
            </button>
        </div>
    </header>

    <div id="todo-panel" class="todo-panel hidden">
        <div class="todo-header">
            <span>Tasks</span>
            <button class="icon-btn small" onclick="toggleTodo()"><i class="fa fa-times"></i></button>
        </div>
        <div class="todo-input-row">
            <input id="todo-input" type="text" placeholder="Add a task…" onkeydown="if(event.key==='Enter') addTodo()">
            <button class="icon-btn small" onclick="addTodo()"><i class="fa fa-plus"></i></button>
        </div>
        <ul id="todo-list"></ul>
    </div>

    <main class="main">
        <div class="clock-block">
            <div class="clock" id="clock"></div>
            <div class="date" id="date-display"></div>
        </div>

        <div class="intention-block">
            <div id="intention-input-area" class="intention-input-area">
                <p class="intention-prompt">What is your intention for today?</p>
                <input id="intention-input" type="text" autocomplete="off" placeholder="Type and press Enter…"
                    onkeydown="if(event.key==='Enter') saveIntention()">
            </div>
            <div id="intention-display" class="intention-display hidden">
                <span class="intention-label">TODAY</span>
                <div class="intention-row" onmouseenter="showIntentionOpts()" onmouseleave="hideIntentionOpts()">
                    <input type="checkbox" id="intention-check" class="intention-check" onchange="toggleIntentionDone()">
                    <span id="intention-text" class="intention-text"></span>
                    <button class="icon-btn small intention-remove hidden" id="intention-remove" onclick="clearIntention()">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
                <div id="done-message" class="done-message">✦ Wonderful! ✦</div>
            </div>
        </div>

        <div class="quote-block">
            <div id="quote-loader" class="quote-loader">
                <div class="spinner"></div>
            </div>
            <div id="quote-content" class="quote-content hidden">
                <p id="quote-text" class="quote-text"></p>
                <p id="quote-author" class="quote-author"></p>
                <div class="quote-actions">
                    <button class="icon-btn" onclick="tweetQuote()" title="Share on X/Twitter"><i class="fab fa-x-twitter"></i></button>
                    <button class="icon-btn" onclick="fetchQuote()" title="New quote"><i class="fas fa-rotate-right"></i></button>
                </div>
            </div>
        </div>
    </main>

    <div class="photo-credit" id="photo-credit"></div>

    <script src="script.js"></script>
</body>
</html>
